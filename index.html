<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Gang Radio</title>

<link rel="apple-touch-icon" href="./apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" href="./apple-touch-icon.png?v=3">

<style>
html, body {
    margin: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
}

body {
    min-height: 100vh;
    background-image:
        linear-gradient(rgba(0,0,0,.30), rgba(0,0,0,.55)),
        url("./radio-background.PNG");
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 40px 20px 80px;
}

h1 {
    font-size: clamp(36px, 8vw, 64px);
    margin: 0 0 35px;
    font-weight: 800;
    text-shadow: 2px 2px 8px #000;
}

.tagline {
    font-size: clamp(18px, 4vw, 26px);
    line-height: 1.5;
    margin-bottom: 80px;
    text-shadow: 2px 2px 6px #000;
}

.warning {
    font-size: clamp(22px, 5vw, 42px);
    font-weight: 800;
    line-height: 1.35;
    text-align: center;
    margin-bottom: 90px;
    text-shadow: 2px 2px 8px #000;
}

h2 {
    font-size: clamp(30px, 6vw, 48px);
    margin-bottom: 25px;
    text-shadow: 2px 2px 8px #000;
}

.player {
    width: 100%;
    max-width: 800px;
    filter: drop-shadow(0 4px 8px #000);
}
</style>
</head>

<body>
<div class="container">

<h1>Recovery Gang Radio</h1>

<div class="tagline">
Original music. Independent voices. Zero corporate playlists.
</div>

<div class="warning">
⚠️ FAIR WARNING: THIS MUSIC IS NOT FOR LEFTISTS. ⚠️
</div>

<h2>Listen Live</h2>

<audio class="player" controls preload="none">
    <source src="http://YOUR-STATION-ADDRESS:8000/recoverygang.mp3" type="audio/mpeg">
    Your browser does not support the audio player.
</audio>

</div>
</body>
</html>
