<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recovery Gang Radio</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; overflow:hidden; }
  body { font-family:-apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color:#fff; }
  #bg {
    position:fixed; inset:0; width:100%; height:100%;
    object-fit:cover; object-position:center center;
    background:#000;
  }
  #info {
    position:fixed; top:15px; left:15px; z-index:2;
    max-width:min(430px, calc(100vw - 30px)); box-sizing:border-box;
    padding:14px 16px;
    background:rgba(0,0,0,0.78); border-radius:16px;
  }
  #info h1 { margin:0 0 2px; font-size:20px; letter-spacing:.3px; }
  #clock { font-size:15px; opacity:.92; }
  #weather { font-size:15px; margin-top:2px; }
  #np { margin-top:10px; border-top:1px solid rgba(255,255,255,.22); padding-top:9px; }
  #np .label, #prev .label {
    font-size:11px; text-transform:uppercase; letter-spacing:1.2px; opacity:.65;
  }
  #np-title { font-size:17px; font-weight:600; margin-top:2px; overflow-wrap:anywhere; }
  #prev { margin-top:9px; }
  #prev ul { margin:4px 0 0; padding-left:18px; font-size:13.5px; line-height:1.45; opacity:.92; }
  #yt { display:inline-block; margin-top:11px; color:#ffb3b3; font-size:14px; text-decoration:none; }
  #yt:hover { text-decoration:underline; }
  #bar {
    position:fixed; left:15px; right:15px; bottom:22px;
    max-width:600px; margin:auto; padding:12px; box-sizing:border-box;
    background:rgba(0,0,0,0.78); border-radius:16px; z-index:2;
  }
  #bar audio { display:block; width:100%; }
</style>
</head>
<body>

<video id="bg" autoplay muted loop playsinline preload="auto"></video>

<div id="info">
  <h1>Recovery Gang Radio</h1>
  <div id="clock"></div>
  <div id="weather" hidden></div>
  <div id="np">
    <div class="label">Now Playing</div>
    <div id="np-title">…</div>
  </div>
  <div id="prev" hidden>
    <div class="label">Last 5 Played</div>
    <ul id="prev-list"></ul>
  </div>
  <a id="yt" href="https://www.youtube.com/watch?v=A0CVYnMv7cA" target="_blank" rel="noopener">▶ Watch the live video on YouTube</a>
</div>

<div id="bar">
<audio controls preload="none">
<source src="https://recoverygangradio.duckdns.org:8001/recoverygang.mp3" type="audio/mpeg">
Your browser does not support the audio player.
</audio>
</div>

<script>
(function () {
  var v = document.getElementById('bg');
  var current = null;
  var ASSETS = {
    portrait:  { src: 'remembrance-portrait.mp4',  poster: 'remembrance-portrait.jpg' },
    square:    { src: 'remembrance-square.mp4',    poster: 'remembrance-square.jpg' },
    landscape: { src: 'remembrance-landscape.mp4', poster: 'remembrance-landscape.jpg' }
  };
  function pick() {
    var r = window.innerWidth / window.innerHeight;
    var name = r <= 0.7 ? 'portrait' : (r <= 1.5 ? 'square' : 'landscape');
    if (name === current) return;
    current = name;
    v.poster = ASSETS[name].poster;
    v.src = ASSETS[name].src;
    var p = v.play();
    if (p && p.catch) p.catch(function () {});
  }
  var timer = null;
  function onResize() {
    clearTimeout(timer);
    timer = setTimeout(pick, 300);
  }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', onResize);
  pick();
})();

/* Listener's own local clock */
(function () {
  var el = document.getElementById('clock');
  function tick() {
    var d = new Date();
    el.textContent = d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) +
      ' · ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
  }
  tick();
  setInterval(tick, 1000);
})();

/* Listener-local weather: shown ONLY when the visitor's location is
   available (permission granted) and the lookup succeeds. Otherwise the
   weather line stays hidden - no other place's weather is ever shown. */
(function () {
  var el = document.getElementById('weather');
  if (!('geolocation' in navigator)) return;
  var CODES = {
    0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
    45: 'Fog', 48: 'Fog', 51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
    56: 'Freezing drizzle', 57: 'Freezing drizzle', 61: 'Light rain', 63: 'Rain',
    65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain', 71: 'Light snow',
    73: 'Snow', 75: 'Heavy snow', 77: 'Snow grains', 80: 'Light showers',
    81: 'Showers', 82: 'Heavy showers', 85: 'Snow showers', 86: 'Snow showers',
    95: 'Thunderstorm', 96: 'Thunderstorm with hail', 99: 'Thunderstorm with hail'
  };
  navigator.geolocation.getCurrentPosition(function (pos) {
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' +
      encodeURIComponent(pos.coords.latitude.toFixed(4)) + '&longitude=' +
      encodeURIComponent(pos.coords.longitude.toFixed(4)) +
      '&current=temperature_2m,weather_code';
    fetch(url).then(function (r) { return r.json(); }).then(function (data) {
      if (!data || !data.current) return;
      var t = Math.round(data.current.temperature_2m);
      var label = CODES[data.current.weather_code] || 'Weather';
      el.textContent = 'Your weather: ' + t + '°C · ' + label;
      el.hidden = false;
    }).catch(function () { /* stays hidden */ });
  }, function () { /* location unavailable: stays hidden */ }, { timeout: 8000, maximumAge: 600000 });
})();

/* Now playing + last 5, fed by the bridge-published now-playing.json */
(function () {
  var titleEl = document.getElementById('np-title');
  var prevBox = document.getElementById('prev');
  var prevList = document.getElementById('prev-list');
  function render(data) {
    if (data.now_playing && data.now_playing.title) {
      titleEl.textContent = data.now_playing.title;
    } else {
      titleEl.textContent = 'Off air right now';
    }
    prevList.textContent = '';
    var prev = data.previous || [];
    prev.forEach(function (song) {
      var li = document.createElement('li');
      li.textContent = song.title;
      prevList.appendChild(li);
    });
    prevBox.hidden = prev.length === 0;
  }
  function load() {
    fetch('now-playing.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(render)
      .catch(function () { /* keep the last good reading on screen */ });
  }
  load();
  setInterval(load, 10000);
})();
</script>

</body>
</html>
